</head><body><div id="app"></div>
<script>
/* ===== SETTINGS ===== */
let MODELS=["openai/gpt-oss-120b","openai/gpt-oss-20b","llama-3.3-70b-versatile"],MI=0,MODEL=MODELS[0];   // faster: "llama-3.1-8b-instant"

const LV=["Easy","Medium","Hard"],MAXT=8;
const $=document.getElementById("app");let S={t:0,l:0},P=load(),R=null,KEY="",KEYS=getKeys(),KI=0;KEY=KEYS[0]||"";

function save(){try{localStorage.setItem("ff2",JSON.stringify(P))}catch(e){}}
function getKey(){try{return localStorage.getItem("ff_groq")||""}catch(e){return""}}

const cnt=t=>(t.toLowerCase().match(/[a-z']+/g)||[]).length;

/* ---- LLM (Groq) with automatic key switching ---- */
const ERR=(m,c)=>{const e=new Error(m);e.code=c;return e};

function setKeys(a){KEYS=a;KI=0;KEY=a[0]||"";try{localStorage.setItem("ff_keys",JSON.stringify(a));localStorage.removeItem("ff_groq")}catch(e){}}
async function callOnce(prompt){
 let txt="";
 if(KEY){const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({model:MODEL,temperature:.7,max_tokens:1500,reasoning_effort:"low",response_format:{type:"json_object"},messages:[{role:"system",content:"Reply with valid JSON only."},{role:"user",content:prompt}]})});
  if(r.status===404&&MI<MODELS.length-1){MI++;MODEL=MODELS[MI];return callOnce(prompt)}if(r.status===401||r.status===403)throw ERR("Your API key is invalid.","auth");if(r.status===429)throw ERR("This API key has reached its limit.","limit");if(!r.ok){let t="";try{t=(await r.text()).slice(0,140)}catch(e){}throw ERR("AI error "+r.status+" "+t)}
  txt=(await r.json()).choices[0].message.content}
 else{const r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
  if(r.status===404)throw ERR("No server found here. Add your Groq key in Settings.","auth");if(r.status===429)throw ERR("The shared key reached its limit. Add your own key in Settings.","limit");if(!r.ok)throw ERR("Server error "+r.status);txt=(await r.json()).text}
 const m=txt.match(/\{[\s\S]*\}/);return JSON.parse(m?m[0]:txt)}
let lastPrompt=0;
async function llm(prompt){let last=null;const tries=Math.max(1,KEYS.length);
 for(let n=0;n<tries;n++){try{return await callOnce(prompt)}catch(e){last=e;if((e.code==="limit"||e.code==="auth")&&KEYS.length>1&&n<tries-1){KI=(KI+1)%KEYS.length;KEY=KEYS[KI];continue}break}}
 if((last.code==="limit"||last.code==="auth")&&Date.now()-lastPrompt>60000){lastPrompt=Date.now();setTimeout(()=>settings(last.message+" Paste a new key below."),50)}
 throw last}

/* ---- Home ---- */
function talkHome(){S.on=0;$.innerHTML=`${hd("Your AI voice assistant and English coach. Just talk.")}
${ready()?"":`<div class="warn">Add your free Groq API key in ⚙️ Settings to start talking.</div>`}
<div class="stats"><div class="st"><b>${Math.round(P.min*10)/10}</b><span>MIN SPOKEN</span></div><div class="st"><b>${P.words}</b><span>WORDS</span></div><div class="st"><b>🔥 ${streak()}</b><span>DAY STREAK</span></div></div>
<div class="heroTalk"><div class="orbwrap ai"><span class="ring"></span><span class="ring"></span><span class="ring"></span><button class="orb" onclick="begin()"><span class="mi">🎙️</span></button></div><b style="font-size:21px">Tap to talk with Ollie</b>
<div class="hint" style="max-width:480px">Hands-free, like a phone call. Say “Telugu lo cheppu” to switch to Telugu, or “speak in English” to switch back. No menus needed.</div></div>
<div class="lab" style="text-align:center">What do you want to talk about?</div><div class="chips">${TOP.map((t,i)=>`<button class="${S.t===i?"on":""}" onclick="S.t=${i};home()">${t[0]} ${t[1]}</button>`).join("")}</div>`}

function settings(msg){document.querySelectorAll(".modal").forEach(m=>m.remove());const m=document.createElement("div");m.className="modal";
 const st=KEYS.length?`Active key: <b>${esc(mask(KEY))}</b> (${KI+1} of ${KEYS.length})`:WORKER_URL?"Using the shared server key.":"No key yet.";
 m.innerHTML=`<div><h2>⚙️ API keys</h2>${msg?`<div class="warn">⚠️ ${esc(msg)}</div>`:""}<div class="hint">${st}</div>
 <div class="hint">Paste your Groq keys, one per line (get free keys at <a href="https://console.groq.com" target="_blank" rel="noopener">console.groq.com</a>). The first one is used. When it reaches its limit, the app switches to the next one automatically. Keys are saved only in this browser.</div>
 <textarea id="k" placeholder="gsk_...&#10;gsk_... (optional backup)" spellcheck="false">${esc(KEYS.join("\n"))}</textarea><div class="hint" id="kmsg"></div>
 <div class="row" style="margin-top:8px"><button style="flex:1" onclick="this.closest('.modal').remove()">Close</button><button class="cta" id="ksave" style="flex:1.4;margin:0;padding:12px" onclick="saveKeys()">Save &amp; test</button></div>
 ${KEYS.length?`<p style="text-align:center;margin:12px 0 0"><a href="#" onclick="setKeys([]);settings();return false">Remove my keys</a></p>`:""}</div>`;
 document.body.appendChild(m)}
async function saveKeys(){const a=[...new Set(document.getElementById("k").value.split(/[\s,]+/).map(x=>x.trim()).filter(Boolean))];const o=document.getElementById("kmsg"),b=document.getElementById("ksave");
 setKeys(a);if(!a.length&&!WORKER_URL){o.textContent="Please paste at least one key.";return}
 b.disabled=true;o.textContent="Testing…";lastPrompt=Date.now();
 try{await llm('Return ONLY JSON: {"ok":true}');o.innerHTML="✅ Key works! Saved.";setTimeout(()=>{document.querySelectorAll(".modal").forEach(x=>x.remove());home()},900)}
 catch(e){o.innerHTML="❌ "+esc(e.message)+" Check the key and try again.";b.disabled=false}}
function theme(){const t=document.documentElement.dataset.theme==="light"?"dark":"light";document.documentElement.dataset.theme=t;try{localStorage.setItem("ff_theme",t)}catch(e){}}
try{document.documentElement.dataset.theme=localStorage.getItem("ff_theme")||"dark"}catch(e){}
/* ---- Voice Assistant: hands-free, auto language, human-like voices ---- */
P.cfg=Object.assign({eng:"server",vn:"",ov:"autumn",rate:1,wait:1100,gtts:true,lang:"en"},P.cfg||{});if(!P.cfg.v2){P.cfg.wait=1100;if(P.cfg.eng==="auto")P.cfg.eng="server";P.cfg.v2=1}
const LG=()=>["en","English","en-IN","English"];
const langNote=()=>S.nat&&String(S.nat).slice(0,2)!=="en"?` Write the strength and focus text in the language with code "${S.nat}" (keep English example phrases in English).`:"";
let TK=0,curAudio=null,MS=null,AC=null,AN=null,REC=null,VAD=null,SI=0;const STTM=["whisper-large-v3","whisper-large-v3-turbo"];let SRVTTS=true;const NOSRV=new Set();
const SCR=[["te",/[\u0C00-\u0C7F]/],["hi",/[\u0900-\u097F]/],["ta",/[\u0B80-\u0BFF]/],["kn",/[\u0C80-\u0CFF]/],["ml",/[\u0D00-\u0D7F]/],["bn",/[\u0980-\u09FF]/],["gu",/[\u0A80-\u0AFF]/],["pa",/[\u0A00-\u0A7F]/]];

const LW={te:/telugu|tel+ugu|తెలుగు/i,hi:/hindi|हिंदी|हिन्दी/i,ta:/tamil|தமிழ்/i,kn:/kannada|ಕನ್ನಡ/i,ml:/malayalam|മലയാളം/i,bn:/bengali|bangla|বাংলা/i,mr:/marathi|मराठी/i,gu:/gujarati|ગુજરાતી/i,pa:/punjabi|ਪੰਜਾਬੀ/i,en:/english|ఇంగ్లీష్|ఇంగ్లిష్|अंग्रेज़ी|अंग्रेजी|இங்கிலீஷ்/i};

function cleanSTT(d){const s=d.segments;if(Array.isArray(s)&&s.length)return s.filter(x=>!(x.no_speech_prob>.6&&x.avg_logprob<-1)&&!(x.avg_logprob<-1.6)).map(x=>x.text).join(" ").trim();return(d.text||"").trim()}
function sttPrompt(){const a=[...(S.m||[])].reverse().find(m=>m.r==="ai");return("Indian English conversation, may include Telugu or Hindi words. "+(a?a.segs.map(s=>s.t).join(" "):"")).slice(-220)}
function vscore(v,l){return(l==="en"&&(/en[-_]IN/i.test(v.lang)||/india/i.test(v.name))?10:0)+(/natural|neural|online/i.test(v.name)?5:0)+(/microsoft|google/i.test(v.name)?1:0)}
function pickVoice(l){let vs=[];try{vs=speechSynthesis.getVoices()||[]}catch(e){}
 if(l==="en"){if(P.cfg.vn){const v=vs.find(x=>x.name===P.cfg.vn);if(v)return v}return vs.filter(v=>/^en/i.test(v.lang)).sort((a,b)=>vscore(b,l)-vscore(a,l))[0]}
 return vs.filter(v=>v.lang.toLowerCase().startsWith(l)).sort((a,b)=>vscore(b,l)-vscore(a,l))[0]}
function stopSpeak(){TK++;try{speechSynthesis.cancel()}catch(e){}try{curAudio&&curAudio.pause()}catch(e){}}
function browserSay(t,l,v){return new Promise(res=>{try{const u=new SpeechSynthesisUtterance(t);v=v||pickVoice(l);if(v){u.voice=v;u.lang=v.lang}else u.lang=l==="en"?"en-IN":l;u.rate=+P.cfg.rate||1;u.onend=u.onerror=()=>res();speechSynthesis.speak(u)}catch(e){res()}})}
function chunk(t){const o=[];let c="";for(const s of t.split(/(?<=[.!?।])\s+/)){if((c+" "+s).length>170&&c){o.push(c);c=s}else c=c?c+" "+s:s}if(c)o.push(c);return o}
function playUrl(u){return new Promise(res=>{const a=new Audio(u);curAudio=a;a.onended=a.onerror=()=>res();a.play().catch(()=>res())})}
let ODOWN=false;

 if(!r.ok){if(KEY&&l==="en"&&!ODOWN)return orphDirect(text);let m="";try{m=(await r.text()).slice(0,80)}catch(e){}throw new Error(r.status+" "+m)}return URL.createObjectURL(await r.blob())}
async function speakQ(segs){stopSpeak();const tk=TK;
 for(const p of segs){if(tk!==TK)return;const t=String(p.t||"").trim();if(!t)continue;const l=String(p.l||"en").slice(0,2).toLowerCase();
  if(((SRVTTS&&!NOSRV.has(l))||(KEY&&l==="en"&&!ODOWN))&&P.cfg.eng!=="auto"){try{const us=chunk(t).map(c=>orph(c,l));us.forEach(p=>p.catch(()=>{}));for(const u of us){if(tk!==TK)return;await playUrl(await u)}continue}catch(e){if(/^(404|405)/.test(e.message))SRVTTS=false;else if(/^501/.test(e.message))NOSRV.add(l);S.vmsg=SRVTTS?(NOSRV.has(l)?"":"Server voice failed ("+e.message+"). Using device voice."):"Server not running: run node dev-server.js (see README). Using device voice.";if(S.on)draw()}}
  const v=pickVoice(l);
  if(v||l==="en"||!P.cfg.gtts){await browserSay(t,l,v)}
  else{for(const c of chunk(t)){if(tk!==TK)return;await playUrl("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl="+l+"&q="+encodeURIComponent(c))}}}}
function sys(){return `You are Ollie, a warm, sharp, genuinely helpful AI voice assistant, in the spirit of the best modern AI assistants. You are talking out loud with a real person, so speak the way a thoughtful, knowledgeable friend would.
HOW TO REPLY:
- Respond to exactly what the person said and meant. Answer questions directly and correctly first, then add the most useful detail. Never dodge, never repeat their words back, never give a generic reply.
- Match length to the moment: one or two short sentences for small talk; a clear, complete answer (up to about 110 words) for questions, advice, explanations, stories or plans. Simple spoken sentences, concrete examples, natural rhythm. No lists, no markdown, no emojis, no headings.
- Remember everything said earlier and build on it. Use their name and details they shared.
- Show real understanding: if they are stressed, be kind first; if they are excited, share it; be light and funny only when it fits.
- Ask a follow-up question only when it truly moves the conversation forward, not at the end of every reply.
- If something is unclear, make your best guess from context, or ask one short clarifying question.
- Be honest. If you do not know, say so plainly. Never invent facts.
- Your English is clear, natural, neutral Indian English: simple words, contractions (I'm, don't, let's), warm tone, Indian examples when helpful. If the person struggles in English, help gently in their language and give the English sentence to repeat.
LANGUAGE RULES: Understand any language the person speaks (Telugu, Hindi, Tamil, English or mixed). CURRENT SPEAKING LANGUAGE: ${LN[S.lang||"en"]} (code ${S.lang||"en"}). ${(S.lang||"en")==="en"?"Reply in English unless the person asks otherwise.":"EVERY segment of your reply MUST be written in "+LN[S.lang]+" (native script) with l set to "+S.lang+". Put any English phrase you want them to repeat in its own segment with l set to en. Do not switch back until they ask."}
SPEECH-TO-TEXT NOTE: the person's words come from automatic speech recognition and may have wrong, missing or similar-sounding words, or Telugu/Hindi words written in English letters. Infer the most likely meaning from context and answer that. Never blame them.
OUTPUT: "segments" is a list of {"t":text,"l":language code like en, te, hi, ta, kn, ml, bn, mr, gu} so each part is spoken in the right language. Write Telugu in Telugu script, Hindi in Devanagari, and so on. Topic hint: ${TOP[S.t][1]}.`}

async function micOn(){if(MS)return;MS=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});AC=new(window.AudioContext||window.webkitAudioContext)();const src=AC.createMediaStreamSource(MS);AN=AC.createAnalyser();AN.fftSize=1024;try{AC.resume&&AC.resume()}catch(e){}src.connect(AN)}

 const rec=REC=new MediaRecorder(MS,mt?{mimeType:mt}:{});S.st="listen";S.had=false;S.err="";S.t0=0;draw();
 rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};

 const buf=new Float32Array(AN.fftSize),start=Date.now();let last=start,noise=.01,hot=0,peak=0;
 clearInterval(VAD);VAD=setInterval(()=>{try{AN.getFloatTimeDomainData(buf)}catch(e){return}let sum=0;for(let i=0;i<buf.length;i++)sum+=buf[i]*buf[i];const rms=Math.sqrt(sum/buf.length),now=Date.now();
  
  if(!S.had)noise=rms<noise?noise*.9+rms*.1:Math.min(.08,noise+(rms-noise)*.02);let th=Math.max(.012,noise*3);if(S.had){peak=Math.max(peak*.9985,rms);th=Math.max(th,peak*.22)}if(rms>th){if(!hot)hot=now;if(now-hot>=120){last=now;if(!S.had){S.had=true;S.t0=now;peak=rms;draw()}}}else hot=0;if(S.had&&now-S.t0>25000)stopRec();
  const lv=document.getElementById("lvl");if(lv)lv.style.transform="scale("+(1+Math.min(rms*8,.35))+")";
  if(S.had&&now-last>(+P.cfg.wait||2000))stopRec();else if(!S.had&&now-start>30000)stopRec()},50)}

async function stt(blob){const ext=/mp4/.test(blob.type)?"mp4":"webm";
 if(SRVSTT){try{const b64=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(",")[1]);f.readAsDataURL(blob)});
  const r=await fetch("/api/stt",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({audio:b64,ext,prompt:sttPrompt(),lang:S.lang||""})});
  if(r.ok)return(await r.json()).text||"";if([404,405,501].includes(r.status))SRVSTT=false;else if([429,401,403].includes(r.status)&&!KEYS.length)throw ERR("The shared speech limit is reached. Add your own free Groq key in Settings.","limit")}catch(e){if(e.code==="limit")throw e;SRVSTT=false}}
 if(KEYS.length){let last=0;for(let n=0;n<KEYS.length;n++){const fd=new FormData();fd.append("file",blob,"a."+ext);fd.append("model",STTM[SI]);fd.append("temperature","0");fd.append("response_format","verbose_json");fd.append("prompt",sttPrompt());if(S.lang&&S.lang!=="en")fd.append("language",S.lang);

   throw ERR("Speech recognition error "+r.status,last?"limit":"")}

 throw ERR("Speech recognition is not available. Add your free Groq key in Settings (or run the server).","limit")}
async function transcribeSend(blob){S.st="think";draw();const ms=Math.max(1000,Date.now()-S.t0-(+P.cfg.wait||2000));

 catch(e){S.st="idle";S.err="⚠️ "+e.message;if(e.code==="limit"&&Date.now()-lastPrompt>60000){lastPrompt=Date.now();setTimeout(()=>settings("Your API key reached its limit. Paste a new key."),50)}draw()}}

{t:"Polite Opinions",e:"🗣️",tp:5,tip:"Start with “I think” or “In my opinion”, then give a reason with “because”.",ph:["In my opinion, it's a great idea because it saves time.","I see your point, but I'd suggest another way.","I partly agree with you."],q:[["You disagree with your friend. Say it politely.","I see your point, but I think we should wait.","You are wrong.","No way.","Acknowledge first, then disagree."],["Give your opinion on remote work.","I think remote work is good because it saves time.","Remote work good.","Because yes.","Opinion + because + reason."],["You agree with only half of the idea.","I partly agree, but I have a different idea.","Never.","Whatever.","Partly agree keeps it friendly."]]},

if(!P.done)P.done={};
const tabs=()=>`<div class="tabs">${[["talk","🎙️ Speak"],["gram","📘 Grammar"],["comm","🤝 Communicate"]].map(t=>`<button class="${(S.tab||"talk")===t[0]?"on":""}" onclick="S.tab='${t[0]}';home()">${t[1]}</button>`).join("")}</div>`;
function hd(sub){return `<div class="head"><h1 class="logo">🌊 FluentFlow</h1><span class="hb"><button class="ic" onclick="voiceSet()">🔊</button><button class="ic" onclick="theme()">🌓</button><button class="ic" onclick="settings()">⚙️</button></span></div><p class="tag">${sub}</p>${tabs()}`}
function home(){S.on=0;if(S.tab==="gram")return gramHome();if(S.tab==="comm")return commHome();talkHome()}
function done(k){return P.done[k]!=null?` <span class="pill" style="font-size:12px">best ${P.done[k]} ✓</span>`:""}
function gramHome(){$.innerHTML=hd("Learn the grammar that matters. Short rules, instant practice.")+`<div class="lab">Grammar lessons</div><div class="lessons">`+(GR.map((g,i)=>`<button class="lesson" onclick="gramLesson(${i})"><i>${g.e}</i><span><b>${g.t}</b>${done("g"+i)}<small>${g.rule.split(".")[0]}.</small></span></button>`).join(""))+`</div>`}
function gramLesson(i){const g=GR[i];$.innerHTML=`<div class="top"><button class="ic" onclick="home()">←</button><span class="pill">${g.e} ${g.t}</span><span></span></div><div class="card"><b>📖 The rule</b><p>${g.rule}</p></div><div class="card"><b>Examples</b>${g.ex.map(x=>`<p class="exr"><span>${x}</span><button class="ic" data-t="${esc(x)}" onclick="sp(this.dataset.t)">🔊</button><button class="ic" data-t="${esc(x)}" onclick="chk(this)">🎤</button></p>`).join("")}<div class="hint">Tap 🎤 and say the sentence out loud.</div><button id="nx" style="width:100%;margin-top:8px" onclick="newEx('g',${i})">🔄 New examples</button></div><button class="cta" onclick="qgen('g',${i})">Start practice quiz (new questions every time)</button>`}
function commHome(){$.innerHTML=hd("Speak with confidence in real situations.")+`<div class="lab">Communication skills</div><div class="lessons">`+(CM.map((c,i)=>`<button class="lesson" onclick="commLesson(${i})"><i>${c.e}</i><span><b>${c.t}</b>${done("c"+i)}<small>${c.tip.split(".")[0]}.</small></span></button>`).join(""))+`</div>`}
function commLesson(i){const c=CM[i];$.innerHTML=`<div class="top"><button class="ic" onclick="home()">←</button><span class="pill">${c.e} ${c.t}</span><span></span></div><div class="card"><b>💡 Pro tip</b><p>${c.tip}</p></div><div class="card"><b>Say it like this</b>${c.ph.map(x=>`<p class="exr"><span>${x}</span><button class="ic" data-t="${esc(x)}" onclick="sp(this.dataset.t)">🔊</button><button class="ic" data-t="${esc(x)}" onclick="chk(this)">🎤</button></p>`).join("")}<div class="hint">Listen, then repeat out loud (shadowing).</div><button id="nx" style="width:100%;margin-top:8px" onclick="newEx('c',${i})">🔄 New phrases</button></div><button class="cta" onclick="qgen('c',${i})">Practice: choose the best reply (new every time)</button><button class="cta" style="background:var(--card);color:var(--tx);border:1px solid var(--line);box-shadow:none;margin-top:10px" onclick="S.t=${c.tp};S.tab='talk';begin()">🎙️ Practice live with AI</button>`}
function chk(b){const t=b.dataset.t;if(!SR){b.textContent="🚫";return}try{const r=new SR();r.lang="en-IN";b.textContent="…";r.onresult=e=>{const h=(e.results[0][0].transcript.toLowerCase().match(/[a-z']+/g)||[]),w=(t.toLowerCase().match(/[a-z']+/g)||[]),p=Math.round(w.filter(x=>h.includes(x)).length/w.length*100);b.textContent=p>=70?"✅"+p:"🔁"+p};r.onerror=()=>{b.textContent="🎤"};r.onend=()=>{if(b.textContent==="…")b.textContent="🎤"};r.start()}catch(e){b.textContent="🎤"}}
function qz(items,title,key,back,ex){S.q={items:shuf(items),k:0,sc:0,title,key,back,fb:null,o:null,...(ex||{})};qDraw()}
function qDraw(){const q=S.q;if(q.k>=q.items.length){const n=q.items.length;P.done[q.key]=Math.max(P.done[q.key]||0,q.sc);save();return $.innerHTML=`<h1 class="logo">${q.sc===n?"🏆 Perfect!":"🎉 Done!"}</h1><div class="stats" style="grid-template-columns:1fr 1fr"><div class="st"><b>${q.sc}/${n}</b><span>CORRECT</span></div><div class="st"><b>${q.title}</b><span>LESSON</span></div></div><p class="tag">${q.sc===n?"Flawless. Try speaking these ideas with the AI!":"Good work. Retry to get a perfect score."}</p><button class="cta" onclick="qgen('${q.kind}',${q.idx})">New questions</button><button class="cta" style="background:var(--card);color:var(--tx);border:1px solid var(--line);box-shadow:none;margin-top:10px" onclick="${q.back}()">Back to lessons</button>`}
 const it=q.items[q.k];if(!q.o)q.o=shuf([it[1],it[2],it[3]]);
 $.innerHTML=`<div class="top"><button class="ic" onclick="${q.back}()">✕</button><span class="pill">${q.title}</span><span class="pill">${q.k+1}/${q.items.length}</span></div><div class="stage" style="justify-content:flex-start"><div class="hint">${q.src||""}</div><div class="cap" style="font-size:20px">${esc(it[0]).replace("___","_____")}</div>${q.o.map((o,i)=>`<button style="width:100%;text-align:left;${q.fb?(o===it[1]?"border-color:var(--g);color:var(--g)":q.fb.p===i?"border-color:var(--r);color:var(--r)":""):""}" ${q.fb?"disabled":""} onclick="qPick(${i})">${esc(o)}</button>`).join("")}${q.fb?`<div class="fix ${q.fb.ok?"ok":""}">${q.fb.ok?"✅ <b>Correct!</b> ":"❌ <b>Not quite.</b> "}${esc(it[4])}</div><button class="cta" style="margin:0" onclick="S.q.k++;S.q.o=null;S.q.fb=null;qDraw()">Next →</button>`:""}</div>`}
function qPick(i){const q=S.q,it=q.items[q.k],ok=q.o[i]===it[1];if(ok)q.sc++;q.fb={ok,p:i};qDraw();sp(ok?it[1]:it[1])}

/* ===== DYNAMIC QUESTION ENGINE ===== */
const THEMES=["school","travel","office work","family","shopping","sports","health","technology","food","friends","weekend plans","city life","movies","money","the weather","hobbies","public transport","a restaurant","a hotel","social media"];
async function qgen(kind,i){
 const L=kind==="g"?GR[i]:CM[i],key=kind+i,back=kind==="g"?"gramHome":"commHome";
 P.hist=P.hist||{};const hist=P.hist[key]||[];
 $.innerHTML=`<div class="stage"><div class="orbwrap think"><span class="ring"></span><button class="orb"><span class="mi">✨</span></button></div><div class="status">Creating fresh questions…</div></div>`;
 let items=null,why="",src="";
 if(ready()){for(let a=0;a<2&&!items;a++){try{
  const th=shuf(THEMES).slice(0,3).join(", ");
  const r=await llm(`Create 5 NEW multiple-choice English practice questions for an English learner (India).\nLesson: ${L.t}. ${kind==="g"?"Grammar rule: "+L.rule+"\nEach question is ONE sentence containing a ___ blank; the options fill the blank.":"Tip: "+L.tip+"\nEach question is a short real-life situation (like 'Someone says: ...' or 'You need to ...'); the options are 3 things the learner could say; exactly one is natural, polite and correct."}\nUse these themes for variety: ${th}.\nDo NOT repeat or paraphrase these earlier questions: ${JSON.stringify(hist.slice(-25))}\nVariety seed: ${Math.random().toString(36).slice(2,8)}${P.cfg.lang!=="en"?`\nWrite each "why" in ${LG(P.cfg.lang)[3]} (keep English examples in English).`:""}\nReturn ONLY JSON: {"q":[{"p":"question","right":"correct option","w1":"wrong option","w2":"wrong option","why":"one short reason"}]}`);
  const q=Array.isArray(r.q)?r.q:Array.isArray(r)?r:[];
  const ok=q.filter(x=>x&&x.p&&x.right&&x.w1&&x.w2&&x.why&&new Set([x.right,x.w1,x.w2]).size===3&&(kind!=="g"||String(x.p).includes("___"))).map(x=>[String(x.p),String(x.right),String(x.w1),String(x.w2),String(x.why)]);
  if(ok.length>=3){items=ok;src="✨ Fresh AI questions"}else why="AI gave too few valid questions"}catch(e){why=e.message}}}
 else why="no API key";
 if(!items){const fresh=L.q.filter(x=>!hist.includes(x[0]));items=fresh.length>=3?fresh:L.q;src="📚 Practice bank. AI unavailable: "+why}
 P.hist[key]=hist.concat(items.map(x=>x[0])).slice(-40);save();
 qz(items,L.t,key,back,{kind,idx:i,src});
}
async function newEx(kind,i){
 const L=kind==="g"?GR[i]:CM[i];if(!ready())return alert("Add your Groq key in ⚙️ Settings to get new examples.");
 const b=document.getElementById("nx");if(b)b.textContent="Creating…";
 try{const r=await llm(`Give 3 NEW natural ${kind==="g"?"English example sentences that clearly show this grammar: "+L.rule:"English phrases a learner can say for: "+L.t+". Tip: "+L.tip}. Theme: ${shuf(THEMES)[0]}. Simple spoken style, under 15 words each. Variety seed: ${Math.random().toString(36).slice(2,8)}. Return ONLY JSON: {"items":["...","...","..."]}`);
  const a=(r.items||[]).filter(x=>typeof x==="string"&&x.length<120).slice(0,3);if(a.length)L[kind==="g"?"ex":"ph"]=a}catch(e){}
 kind==="g"?gramLesson(i):commLesson(i)}

home();
</script></body></html>
